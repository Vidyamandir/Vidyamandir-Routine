<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Daily Routine Slip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @media print { .no-print { display: none !important; } body { background: white !important; } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans flex flex-col items-center p-3 sm:p-6">

    <script>
        const FIREBASE_DB_URL = "https://school-routine-prasenjit-default-rtdb.firebaseio.com/";
    </script>

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-slate-900 text-white p-4 text-center">
            <i class="fa-solid fa-graduation-cap text-3xl text-amber-400 mb-2"></i>
            <h1 class="text-base font-bold tracking-wide">Teacher Daily Routine Slip</h1>
            <div class="mt-1 flex items-center justify-center gap-2 text-xs text-slate-300">
                <span id="activeDayBadge" class="bg-indigo-900 px-2.5 py-0.5 rounded font-bold text-amber-300">Loading...</span>
                <span id="activePeriodsBadge" class="bg-slate-800 px-2 py-0.5 rounded font-medium">8 Periods</span>
            </div>
        </div>

        <!-- Single Dropdown -->
        <div class="p-4 bg-slate-50 border-b border-slate-200 space-y-2 no-print">
            <label class="block text-xs font-bold text-slate-700">Select Your Name:</label>
            <select id="teacherSelect" onchange="renderTeacherRoutine(this.value)" class="w-full bg-white border-2 border-indigo-500 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm cursor-pointer">
                <option value="">-- Loading Teachers List... --</option>
            </select>
        </div>

        <!-- Routine Display Area -->
        <div id="routineDisplayArea" class="p-4 space-y-2.5 min-h-[250px] flex flex-col justify-center items-center text-slate-400">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-indigo-500"></i>
            <p class="text-xs">Fetching today's routine from cloud...</p>
        </div>

        <div class="p-3 bg-slate-50 border-t border-slate-200 flex justify-between items-center no-print text-xs">
            <button onclick="window.print()" class="text-slate-600 hover:text-slate-900 font-semibold flex items-center gap-1">
                <i class="fa-solid fa-print"></i> Print
            </button>
            <span class="text-[10px] text-slate-400" id="updatedTime">FULIA VIDYAMANDIR</span>
        </div>

    </div>

    <script>
        let liveData = null;

        async function fetchTodayRoutine() {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}todayRoutine.json`);
                liveData = await res.json();

                if (!liveData || !liveData.teachers) {
                    document.getElementById('routineDisplayArea').innerHTML = `
                        <div class="text-center text-rose-600 text-xs">
                            <i class="fa-solid fa-circle-exclamation text-3xl mb-2"></i>
                            <p class="font-bold">Today's routine has not been published yet!</p>
                            <p class="text-slate-500 mt-1">Please ask the Headmaster to click 'Share Link' from portal.</p>
                        </div>`;
                    return;
                }

                document.getElementById('activeDayBadge').innerText = liveData.day;
                document.getElementById('activePeriodsBadge').innerText = `${liveData.periods} Periods`;
                document.getElementById('updatedTime').innerText = `Updated: ${liveData.updatedAt || 'Today'}`;

                // Populate Dropdown
                const sel = document.getElementById('teacherSelect');
                sel.innerHTML = '<option value="">-- Choose Your Name --</option>';

                const teacherIds = Object.keys(liveData.teachers).sort((a,b) => {
                    return liveData.teachers[a].name.localeCompare(liveData.teachers[b].name);
                });

                teacherIds.forEach(id => {
                    const t = liveData.teachers[id];
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.innerText = `${t.name} (${id}) - ${t.dept}`;
                    sel.appendChild(opt);
                });

                document.getElementById('routineDisplayArea').innerHTML = `
                    <i class="fa-solid fa-hand-pointer text-3xl text-indigo-400 mb-2 animate-bounce"></i>
                    <p class="text-xs text-center font-medium">Please select your name from the dropdown above to view your classes.</p>`;

            } catch(e) {
                document.getElementById('routineDisplayArea').innerHTML = `
                    <div class="text-center text-rose-500 text-xs">
                        <p class="font-bold">Failed to connect to cloud database.</p>
                        <p class="text-slate-400">${e.message}</p>
                    </div>`;
            }
        }

        function renderTeacherRoutine(teacherId) {
            const container = document.getElementById('routineDisplayArea');
            if (!teacherId || !liveData) {
                container.innerHTML = `
                    <i class="fa-solid fa-hand-pointer text-3xl text-indigo-400 mb-2 animate-bounce"></i>
                    <p class="text-xs text-center font-medium">Please select your name from the dropdown above.</p>`;
                return;
            }

            const t = liveData.teachers[teacherId];
            const numPeriods = liveData.periods || 8;
            let cardsHTML = '';
            let classCount = 0;

            for (let p = 1; p <= numPeriods; p++) {
                const pKey = `P${p}`;
                const cls = (t.classes && t.classes[pKey]) ? t.classes[pKey] : null;

                if (!cls) {
                    cardsHTML += `
                        <div class="flex items-center justify-between p-2.5 rounded-xl border border-slate-200 bg-slate-50">
                            <span class="font-bold text-xs text-slate-500 w-12">${pKey}</span>
                            <span class="text-xs text-slate-400 font-medium">Free Period</span>
                            <span class="text-[10px] text-slate-400">--</span>
                        </div>`;
                } else if (cls.sub) {
                    classCount++;
                    cardsHTML += `
                        <div class="flex items-center justify-between p-2.5 rounded-xl border-2 border-rose-400 bg-rose-50 shadow-sm">
                            <div class="flex items-center gap-2">
                                <span class="font-black text-xs text-rose-700 w-12">${pKey}</span>
                                <div>
                                    <div class="text-xs font-bold text-rose-900">${cls.c} • <span class="text-slate-800">${cls.s}</span></div>
                                    <div class="text-[10px] text-rose-600 font-bold">Substitute Class (For: ${cls.f})</div>
                                </div>
                            </div>
                            <span class="bg-rose-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full">SUB</span>
                        </div>`;
                } else {
                    classCount++;
                    cardsHTML += `
                        <div class="flex items-center justify-between p-2.5 rounded-xl border border-teal-200 bg-teal-50/70">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs text-teal-900 w-12">${pKey}</span>
                                <div>
                                    <div class="text-xs font-bold text-slate-800">${cls.c} • <span class="text-teal-900 font-semibold">${cls.s}</span></div>
                                    <div class="text-[10px] text-slate-500">Regular Class</div>
                                </div>
                            </div>
                            <span class="bg-teal-700 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">REG</span>
                        </div>`;
                }
            }

            container.innerHTML = `
                <div class="w-full space-y-2.5">
                    <div class="flex justify-between items-center bg-indigo-50 p-2.5 rounded-xl border border-indigo-100">
                        <div>
                            <div class="text-xs font-black text-indigo-950">${t.name}</div>
                            <div class="text-[10px] text-slate-500">${t.dept}</div>
                        </div>
                        <span class="text-xs font-black text-indigo-900 bg-white border border-indigo-200 px-2 py-0.5 rounded-lg shadow-sm">
                            Total: ${classCount} Classes
                        </span>
                    </div>
                    <div class="space-y-1.5">
                        ${cardsHTML}
                    </div>
                </div>`;
        }

        window.onload = fetchTodayRoutine;
    </script>
</body>
</html>
